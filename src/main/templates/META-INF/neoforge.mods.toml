modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://extraspecialstudio.co.uk"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
logoFile="${mod_id}.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="extraspecialcore"
type="required"
versionRange="${esc_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="extraspeciallib"
type="required"
versionRange="${esl_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="extraspecialhub"
type="optional"
versionRange="${esh_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="alltheleaks"
type="required"
versionRange="[1.0,)"
ordering="AFTER"
side="SERVER"
