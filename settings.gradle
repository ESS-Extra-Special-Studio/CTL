pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'calml-the-leaks-ctl'

includeBuild('../ESC') {
    dependencySubstitution {
        substitute module('uk.co.extraspecialstudio:extraspecialcore') using project(':')
    }
}
